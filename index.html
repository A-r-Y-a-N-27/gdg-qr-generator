<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Designer Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <!-- Phosphor Icons for better visuals -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* Custom Animations */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .toast {
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
    </style>
</head>
<body class="animated-bg min-h-screen p-4 md:p-10 font-sans text-gray-800 flex flex-col items-center justify-center transition-all duration-500">

    <div class="w-full max-w-6xl">
        <header class="text-center mb-10 text-white drop-shadow-md">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-2 tracking-tight">QR Creator Studio</h1>
            <p class="text-lg opacity-90 font-medium">Design, customize, and generate instantly.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Column: Inputs & Customization -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- 1. Data Type Panel -->
                <div class="glass-panel p-6 md:p-8 rounded-2xl shadow-xl transition-all hover:shadow-2xl">
                    <h2 class="text-xl font-bold mb-5 flex items-center gap-2 text-indigo-900">
                        <i class="ph-fill ph-database"></i> 1. Select Data Type
                    </h2>
                    
                    <!-- Interactive Tabs -->
                    <div class="flex flex-wrap gap-2 mb-6" id="type-tabs">
                        <button onclick="switchType('text')" class="tab-btn active px-4 py-2 rounded-lg font-medium transition-all duration-200 bg-indigo-600 text-white shadow-md hover:scale-105">Text</button>
                        <button onclick="switchType('url')" class="tab-btn px-4 py-2 rounded-lg font-medium transition-all duration-200 bg-white text-gray-600 hover:bg-gray-50 shadow-sm hover:scale-105">URL</button>
                        <button onclick="switchType('email')" class="tab-btn px-4 py-2 rounded-lg font-medium transition-all duration-200 bg-white text-gray-600 hover:bg-gray-50 shadow-sm hover:scale-105">Email</button>
                        <button onclick="switchType('phone')" class="tab-btn px-4 py-2 rounded-lg font-medium transition-all duration-200 bg-white text-gray-600 hover:bg-gray-50 shadow-sm hover:scale-105">Phone</button>
                        <button onclick="switchType('wifi')" class="tab-btn px-4 py-2 rounded-lg font-medium transition-all duration-200 bg-white text-gray-600 hover:bg-gray-50 shadow-sm hover:scale-105">Wi-Fi</button>
                    </div>

                    <!-- Dynamic Input Fields -->
                    <div id="input-container" class="space-y-4 relative min-h-[60px]">
                        <input type="hidden" id="qr-type" value="text">
                        
                        <div id="input-text" class="input-group pop-in absolute w-full">
                            <textarea class="w-full p-3 bg-white/70 border border-gray-200 rounded-xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 focus:outline-none transition-all input-field resize-none h-24" placeholder="Enter your secret message..."></textarea>
                        </div>
                        
                        <div id="input-url" class="input-group hidden absolute w-full">
                            <input type="url" class="w-full p-3 bg-white/70 border border-gray-200 rounded-xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 focus:outline-none transition-all input-field" placeholder="https://awesome-website.com">
                        </div>
                        
                        <div id="input-email" class="input-group hidden absolute w-full">
                            <input type="email" class="w-full p-3 bg-white/70 border border-gray-200 rounded-xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 focus:outline-none transition-all input-field" placeholder="hello@example.com">
                        </div>
                        
                        <div id="input-phone" class="input-group hidden absolute w-full">
                            <input type="tel" class="w-full p-3 bg-white/70 border border-gray-200 rounded-xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 focus:outline-none transition-all input-field" placeholder="+1 234 567 8900">
                        </div>
                        
                        <div id="input-wifi" class="input-group hidden absolute w-full grid grid-cols-2 gap-4">
                            <input type="text" id="wifi-ssid" class="p-3 bg-white/70 border border-gray-200 rounded-xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 focus:outline-none transition-all input-field" placeholder="Network Name (SSID)">
                            <input type="password" id="wifi-pass" class="p-3 bg-white/70 border border-gray-200 rounded-xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 focus:outline-none transition-all input-field" placeholder="Password">
                            <select id="wifi-enc" class="p-3 bg-white/70 border border-gray-200 rounded-xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 focus:outline-none transition-all input-field col-span-2">
                                <option value="WPA">WPA / WPA2 (Highly Secure)</option>
                                <option value="WEP">WEP (Older)</option>
                                <option value="nopass">Open Network (No Password)</option>
                            </select>
                        </div>
                    </div>
                    <!-- Spacer to account for absolute positioning of inputs -->
                    <div class="h-24"></div> 
                    
                    <div id="error-msg" class="text-red-500 bg-red-50 p-3 rounded-lg text-sm mt-4 hidden flex items-center gap-2 font-medium">
                        <i class="ph-fill ph-warning-circle text-lg"></i> <span>Invalid input.</span>
                    </div>
                </div>

                <!-- 2. Customization Panel -->
                <div class="glass-panel p-6 md:p-8 rounded-2xl shadow-xl transition-all hover:shadow-2xl">
                    <h2 class="text-xl font-bold mb-5 flex items-center gap-2 text-indigo-900">
                        <i class="ph-fill ph-palette"></i> 2. Stylize & Customize
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">Foreground Color</label>
                            <div class="flex items-center gap-3 bg-white/50 p-2 rounded-xl border border-gray-200">
                                <input type="color" id="fg-color" value="#1e1b4b" class="w-10 h-10 rounded-lg cursor-pointer input-field border-0 p-0 bg-transparent">
                                <span class="text-sm text-gray-500 font-mono" id="fg-hex">#1e1b4b</span>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">Background Color</label>
                            <div class="flex items-center gap-3 bg-white/50 p-2 rounded-xl border border-gray-200">
                                <input type="color" id="bg-color" value="#ffffff" class="w-10 h-10 rounded-lg cursor-pointer input-field border-0 p-0 bg-transparent">
                                <span class="text-sm text-gray-500 font-mono" id="bg-hex">#ffffff</span>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="flex justify-between text-sm font-semibold text-gray-700">
                                <span>Export Size</span> <span id="size-val" class="text-indigo-600">256px</span>
                            </label>
                            <input type="range" id="qr-size" min="128" max="1024" step="64" value="256" class="w-full accent-indigo-600 input-field">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">Error Correction</label>
                            <select id="err-level" class="w-full p-3 bg-white/70 border border-gray-200 rounded-xl focus:ring-4 focus:ring-indigo-100 focus:outline-none transition-all input-field">
                                <option value="L">Low (7% damage recovery)</option>
                                <option value="M" selected>Medium (15% damage recovery)</option>
                                <option value="Q">Quartile (25% damage recovery)</option>
                                <option value="H">High (30% damage recovery)</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Presets -->
                    <div class="mt-8 pt-6 border-t border-gray-200/50">
                        <label class="block text-sm font-semibold text-gray-700 mb-3">Quick Presets</label>
                        <div class="flex flex-wrap gap-3">
                            <button onclick="applyPreset('#000000', '#ffffff')" class="px-4 py-2 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition-all hover:-translate-y-1 text-sm font-medium flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-black"></div> Classic</button>
                            <button onclick="applyPreset('#ec4899', '#fdf2f8')" class="px-4 py-2 bg-pink-50 border border-pink-200 text-pink-700 rounded-lg shadow-sm hover:shadow-md transition-all hover:-translate-y-1 text-sm font-medium flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-pink-500"></div> Bubblegum</button>
                            <button onclick="applyPreset('#0ea5e9', '#f0f9ff')" class="px-4 py-2 bg-sky-50 border border-sky-200 text-sky-700 rounded-lg shadow-sm hover:shadow-md transition-all hover:-translate-y-1 text-sm font-medium flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-sky-500"></div> Oceanic</button>
                            <button onclick="applyPreset('#16a34a', '#f0fdf4')" class="px-4 py-2 bg-green-50 border border-green-200 text-green-700 rounded-lg shadow-sm hover:shadow-md transition-all hover:-translate-y-1 text-sm font-medium flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-green-600"></div> Forest</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Preview & Output -->
            <div class="lg:col-span-5 space-y-6 flex flex-col">
                
                <!-- Live Preview Card -->
                <div class="glass-panel p-6 md:p-8 rounded-2xl shadow-xl flex-grow flex flex-col items-center justify-center relative overflow-hidden transition-all hover:shadow-2xl">
                    <!-- Decorative background blur -->
                    <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
                    <div class="absolute bottom-0 left-0 w-32 h-32 bg-pink-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>

                    <h2 class="text-xl font-bold mb-6 w-full text-left text-indigo-900 z-10 flex items-center gap-2">
                        <i class="ph-fill ph-eye"></i> Live Preview
                    </h2>
                    
                    <div id="qr-wrapper" class="p-4 bg-white/80 rounded-2xl shadow-inner border border-gray-100 flex justify-center items-center w-64 h-64 z-10 transition-transform duration-300">
                        <canvas id="qr-canvas"></canvas>
                    </div>
                    
                    <div id="contrast-warning" class="w-full text-orange-600 bg-orange-50 p-3 rounded-lg text-sm mt-6 hidden items-center gap-2 font-medium z-10">
                        <i class="ph-fill ph-warning text-xl"></i> Warning: Colors are too similar. Code may not scan!
                    </div>

                    <button onclick="downloadQR()" class="mt-8 w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-4 rounded-xl flex items-center justify-center gap-2 hover:from-indigo-700 hover:to-purple-700 transition-all hover:shadow-lg hover:shadow-indigo-500/30 active:scale-95 font-bold text-lg z-10">
                        <i class="ph-bold ph-download-simple"></i> Download High-Res PNG
                    </button>
                </div>

                <!-- Recent Generations (Loads dynamically) -->
                <div id="recent-container" class="glass-panel p-6 rounded-2xl shadow-xl hidden">
                    <h2 class="text-lg font-bold mb-4 text-indigo-900 flex items-center gap-2">
                        <i class="ph-fill ph-clock-counter-clockwise"></i> Recent Codes
                    </h2>
                    <div id="recent-list" class="space-y-3">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Toast Notification -->
    <div id="toast" class="toast fixed bottom-8 right-8 glass-panel border-l-4 border-green-500 px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 z-50">
        <div class="bg-green-100 text-green-600 p-2 rounded-full">
            <i class="ph-bold ph-check text-xl"></i>
        </div>
        <div>
            <h4 class="font-bold text-gray-800">Success!</h4>
            <p class="text-sm text-gray-600">Your QR code has been downloaded.</p>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            setupEventListeners();
            generateQR();
            loadRecent();
        });

        function setupEventListeners() {
            // Re-generate QR when any input changes
            const inputs = document.querySelectorAll('.input-field');
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    generateQR();
                    animateQRUpdate();
                });
            });

            // Update Hex codes in UI when colors change
            document.getElementById('fg-color').addEventListener('input', (e) => {
                document.getElementById('fg-hex').innerText = e.target.value;
            });
            document.getElementById('bg-color').addEventListener('input', (e) => {
                document.getElementById('bg-hex').innerText = e.target.value;
            });
            // Update Size text
            document.getElementById('qr-size').addEventListener('input', (e) => {
                document.getElementById('size-val').innerText = e.target.value + 'px';
            });
        }

        // Make the QR code "bounce" slightly when updated
        function animateQRUpdate() {
            const wrapper = document.getElementById('qr-wrapper');
            wrapper.style.transform = 'scale(0.95)';
            setTimeout(() => { wrapper.style.transform = 'scale(1)'; }, 150);
        }

        // Switch Tabs with styling
        function switchType(type) {
            document.getElementById('qr-type').value = type;
            
            // Update Tab Button Styles
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                if(tab.innerText.toLowerCase().includes(type) || (type === 'url' && tab.innerText === 'URL')) {
                    tab.className = "tab-btn active px-4 py-2 rounded-lg font-medium transition-all duration-200 bg-indigo-600 text-white shadow-md hover:scale-105";
                } else {
                    tab.className = "tab-btn px-4 py-2 rounded-lg font-medium transition-all duration-200 bg-white text-gray-600 hover:bg-gray-50 shadow-sm hover:scale-105";
                }
            });

            // Show/Hide Input Fields with Pop-in animation
            const groups = document.querySelectorAll('.input-group');
            groups.forEach(g => {
                g.classList.add('hidden');
                g.classList.remove('pop-in');
            });
            
            const activeGroup = document.getElementById(type === 'wifi' ? 'input-wifi' : `input-${type}`);
            activeGroup.classList.remove('hidden');
            // Trigger reflow to restart animation
            void activeGroup.offsetWidth; 
            activeGroup.classList.add('pop-in');

            generateQR();
        }

        function getQRValue() {
            const type = document.getElementById('qr-type').value;
            if (type === 'text') {
                return document.querySelector('#input-text textarea').value || ' ';
            }
            if (type === 'url') {
                return document.querySelector('#input-url input').value || 'https://';
            }
            if (type === 'email') {
                return `mailto:${document.querySelector('#input-email input').value}`;
            }
            if (type === 'phone') {
                return `tel:${document.querySelector('#input-phone input').value}`;
            }
            if (type === 'wifi') {
                const ssid = document.getElementById('wifi-ssid').value;
                const pass = document.getElementById('wifi-pass').value;
                const enc = document.getElementById('wifi-enc').value;
                return `WIFI:T:${enc};S:${ssid};P:${pass};;`;
            }
        }

        function applyPreset(fg, bg) {
            document.getElementById('fg-color').value = fg;
            document.getElementById('bg-color').value = bg;
            document.getElementById('fg-hex').innerText = fg;
            document.getElementById('bg-hex').innerText = bg;
            generateQR();
            animateQRUpdate();
        }

        function generateQR() {
            const canvas = document.getElementById('qr-canvas');
            const value = getQRValue();
            const fgColor = document.getElementById('fg-color').value;
            const bgColor = document.getElementById('bg-color').value;
            
            // Contrast checker
            const warningEl = document.getElementById('contrast-warning');
            // Basic hex similarity check
            if (fgColor === bgColor) {
                warningEl.classList.remove('hidden');
                warningEl.classList.add('flex');
            } else {
                warningEl.classList.add('hidden');
                warningEl.classList.remove('flex');
            }

            QRCode.toCanvas(canvas, value, {
                width: 240, // Visual size in UI (Export size is handled on download)
                margin: 2,
                color: {
                    dark: fgColor,
                    light: bgColor
                },
                errorCorrectionLevel: document.getElementById('err-level').value
            }, function (error) {
                if (error) console.error(error);
            });
        }

        function validate() {
            const type = document.getElementById('qr-type').value;
            const errorMsg = document.getElementById('error-msg');
            const errorText = errorMsg.querySelector('span');
            let isValid = true;

            if (type === 'url' && !document.querySelector('#input-url input').value.startsWith('http')) {
                errorText.innerText = "URL must start with http:// or https://";
                isValid = false;
            } else if (type === 'wifi' && !document.getElementById('wifi-ssid').value) {
                errorText.innerText = "Network Name (SSID) is required for Wi-Fi.";
                isValid = false;
            }

            if (!isValid) {
                errorMsg.classList.remove('hidden');
                errorMsg.classList.add('flex', 'pop-in');
            } else {
                errorMsg.classList.add('hidden');
                errorMsg.classList.remove('flex', 'pop-in');
            }
            return isValid;
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function downloadQR() {
            if (!validate()) return;

            // To download at the requested size, we create a temporary canvas
            const tempCanvas = document.createElement('canvas');
            const value = getQRValue();
            const fgColor = document.getElementById('fg-color').value;
            const bgColor = document.getElementById('bg-color').value;
            const size = document.getElementById('qr-size').value;

            QRCode.toCanvas(tempCanvas, value, {
                width: size,
                margin: 2,
                color: { dark: fgColor, light: bgColor },
                errorCorrectionLevel: document.getElementById('err-level').value
            }, function (error) {
                if (!error) {
                    const url = tempCanvas.toDataURL("image/png");
                    const link = document.createElement('a');
                    link.download = `QR_${new Date().getTime()}.png`;
                    link.href = url;
                    link.click();
                    
                    showToast();
                    saveRecent();
                }
            });
        }

        // Persist to Local Storage
        function saveRecent() {
            const type = document.getElementById('qr-type').value;
            const value = getQRValue();
            const fg = document.getElementById('fg-color').value;
            const bg = document.getElementById('bg-color').value;
            
            let recent = JSON.parse(localStorage.getItem('qr-recent') || '[]');
            
            // Prevent exact duplicates
            recent = recent.filter(item => item.value !== value);
            
            recent.unshift({ 
                type, 
                value, 
                fg, 
                bg,
                date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
            });
            
            recent = recent.slice(0, 4); // Keep top 4
            localStorage.setItem('qr-recent', JSON.stringify(recent));
            loadRecent();
        }

        function loadRecent() {
            const recent = JSON.parse(localStorage.getItem('qr-recent') || '[]');
            const container = document.getElementById('recent-container');
            const list = document.getElementById('recent-list');
            
            if (recent.length === 0) return;
            
            container.classList.remove('hidden');
            list.innerHTML = '';
            
            recent.forEach(item => {
                // Generate a mini canvas for the list
                const row = document.createElement('div');
                row.className = "flex items-center gap-4 bg-white/50 p-3 border border-gray-100 rounded-xl hover:bg-white transition-colors cursor-pointer";
                row.onclick = () => alert("Saved Value:\n" + item.value); // Interactivity

                row.innerHTML = `
                    <div class="w-10 h-10 rounded bg-white shadow-sm flex-shrink-0 flex items-center justify-center p-1">
                        <canvas width="32" height="32" id="mini-${item.date.replace(':','')}"></canvas>
                    </div>
                    <div class="flex-grow min-w-0">
                        <p class="font-bold text-sm uppercase tracking-wider text-indigo-700">${item.type}</p>
                        <p class="text-gray-500 text-xs truncate">${item.value}</p>
                    </div>
                    <div class="text-xs text-gray-400 whitespace-nowrap font-medium">${item.date}</div>
                `;
                list.appendChild(row);

                // Paint the mini canvas
                const miniC = row.querySelector('canvas');
                QRCode.toCanvas(miniC, item.value, { width: 32, margin: 0, color: { dark: item.fg, light: item.bg } });
            });
        }
    </script>
</body>
</html>
